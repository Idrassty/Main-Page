<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Study</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2c3e50">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Arial,sans-serif}
[hidden]{display:none!important}
html,body{height:100%}
body{background:#eef2f3;color:#333}

/* ---------- COVER (disguise screen) ---------- */
#cover{min-height:100%;display:flex;align-items:center;justify-content:center;padding:20px;background:#dfe6e9}
.cover-wrap{position:relative;width:100%;max-width:500px;border-radius:12px;overflow:hidden;box-shadow:0 8px 25px rgba(0,0,0,.15);background:#b2bec3}
.cover-wrap img{width:100%;display:block;min-height:320px;object-fit:cover}
/* Move/resize the clickable bubble here to match your picture */
.bubble{position:absolute;top:6%;left:50%;transform:translateX(-50%);width:62%;padding:14px 12px;background:#fff;border:3px solid #2c3e50;border-radius:22px;
  font-weight:800;font-size:18px;text-align:center;color:#2c3e50;cursor:pointer;user-select:none;transition:.15s}
.bubble:hover{transform:translateX(-50%) scale(1.03)}
.bubble::after{content:"";position:absolute;bottom:-16px;left:22%;border:10px solid transparent;border-top:16px solid #2c3e50}

/* ---------- APP SHELL ---------- */
#app{display:flex;height:100vh}
.sidebar{width:76px;background:#2c3e50;display:flex;flex-direction:column;align-items:center;padding-top:16px;gap:10px}
.tab-btn{background:none;border:none;color:#fff;font-size:26px;cursor:pointer;opacity:.6;padding:10px;width:100%;position:relative}
.tab-btn.active{opacity:1;background:#34495e;border-left:4px solid #4caf50}
.tab-btn .dot{position:absolute;top:8px;right:14px;background:#e74c3c;color:#fff;border-radius:10px;font-size:11px;padding:1px 6px}
.spacer{flex:1}
.main{flex:1;overflow-y:auto;padding:24px;display:flex;justify-content:center}
.page{display:none;width:100%;max-width:760px}
.page.active{display:block}
h1{color:#2c3e50;font-size:24px;margin-bottom:6px;text-align:center}
.sub{text-align:center;color:#7f8c8d;margin-bottom:18px;font-size:14px}
.card{background:#fff;padding:18px;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,.06);margin-bottom:16px}
input,textarea{width:100%;padding:10px;border:1px solid #bdc3c7;border-radius:8px;font-size:15px;outline:none}
input:focus,textarea:focus{border-color:#4caf50}
textarea{height:100px;resize:none;margin-bottom:10px}
input{margin-bottom:10px}
button.pri{background:#4caf50;color:#fff;border:none;padding:11px;font-size:15px;font-weight:700;border-radius:8px;cursor:pointer;width:100%}
button.pri:hover{background:#439a46}
button.sec{background:none;border:none;color:#2980b9;cursor:pointer;font-size:13px;margin-top:8px}
.err{color:#e74c3c;font-size:13px;min-height:18px;margin-bottom:6px}

/* login */
#login{max-width:380px;margin:60px auto}

/* diary */
.today{background:#4caf50;color:#fff;border-radius:12px;padding:12px;text-align:center;font-weight:700;margin-bottom:16px}
.day-h{margin:18px 0 8px;color:#2c3e50;font-weight:700;font-size:15px}
.note{background:#fff;padding:14px;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,.05);margin-bottom:10px;position:relative;white-space:pre-wrap;word-break:break-word}
.note-time{font-size:11px;color:#95a5a6;margin-bottom:4px}
.note-img{max-width:100%;max-height:300px;object-fit:cover;border-radius:8px;margin-top:10px;display:block}
.del{position:absolute;top:12px;right:12px;background:none;border:none;color:#e74c3c;cursor:pointer;font-size:12px}

/* chat */
.chat-grid{display:grid;grid-template-columns:240px 1fr;gap:14px;height:calc(100vh - 140px)}
.friends{overflow-y:auto}
.friends h3{font-size:12px;text-transform:uppercase;color:#95a5a6;margin:12px 0 6px}
.friend{padding:10px;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:6px}
.friend:hover,.friend.sel{background:#e8f5e9}
.friend small{color:#95a5a6}
.mini{padding:4px 8px;font-size:12px;border:none;border-radius:6px;cursor:pointer;color:#fff}
.mini.ok{background:#4caf50}.mini.no{background:#e74c3c}
.chat-box{background:#fff;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,.06);display:flex;flex-direction:column;overflow:hidden}
.chat-head{padding:12px 16px;border-bottom:1px solid #eee;font-weight:700;color:#2c3e50}
.msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.msg{padding:8px 12px;border-radius:8px;max-width:75%;width:fit-content;word-break:break-word;white-space:pre-wrap}
.msg.in{background:#f1f0f0;align-self:flex-start}
.msg.out{background:#dcf8c6;align-self:flex-end}
.msg span{display:block;font-size:10px;color:#7f8c8d;margin-top:3px}
.send{display:flex;gap:8px;padding:12px;border-top:1px solid #eee}
.send input{margin:0;flex:1}
.send button{width:84px}
.empty{color:#95a5a6;text-align:center;padding:30px;font-size:14px}
.back{display:none}
@media(max-width:700px){
  .sidebar{width:56px}.main{padding:12px}
  .chat-grid{grid-template-columns:1fr}
  .chat-grid.open .friends-col{display:none}
  .chat-grid:not(.open) .chat-box{display:none}
  .back{display:inline-block;margin-right:10px;cursor:pointer;color:#2980b9}
}
#banner{position:fixed;top:0;left:0;right:0;z-index:99;background:#e74c3c;color:#fff;padding:10px 14px;font-size:14px;text-align:center}
.bubble{z-index:2}
.chat-head{display:flex;align-items:center;gap:8px}.chat-head #chatTitle{flex:1}
.callbtn{background:#e8f5e9;border:none;border-radius:8px;padding:6px 10px;font-size:18px;cursor:pointer}.callbtn:hover{background:#c8e6c9}
#callUI{position:fixed;inset:0;z-index:50;background:#111;display:flex;flex-direction:column}
#remoteVid{flex:1;width:100%;min-height:0;object-fit:cover;background:#1c1c1c}
#localVid{position:absolute;right:14px;top:14px;width:110px;height:150px;object-fit:cover;border-radius:10px;border:2px solid #fff;background:#000;transform:scaleX(-1)}
#callInfo{position:absolute;top:16px;left:0;right:0;text-align:center;color:#fff;pointer-events:none;text-shadow:0 1px 4px #000}
#callName{font-size:22px;font-weight:700}
.call-bar{display:flex;justify-content:center;gap:18px;padding:18px;background:#000}
.call-bar button{width:60px;height:60px;border-radius:50%;border:none;font-size:26px;cursor:pointer;background:#3a3a3a;color:#fff}
.call-bar button.off{background:#fff;color:#000}
.call-bar .hang{background:#e74c3c}
#incoming{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center}
.inc-box{background:#fff;border-radius:16px;padding:26px;text-align:center;min-width:260px;animation:pulse 1s infinite}
.inc-box div{font-size:18px;font-weight:700;margin-bottom:16px}
.inc-btns{display:flex;gap:12px}.inc-btns button{flex:1;border:none;color:#fff;padding:12px;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer}
@keyframes pulse{50%{transform:scale(1.04)}}

/* hidden globe hotspot (invisible). Add #setup to the URL to see/move it */
.globe{position:absolute;top:41%;left:51%;width:14%;height:12%;border-radius:50%;cursor:default;z-index:2;-webkit-tap-highlight-color:transparent}
.cover-wrap{max-width:560px;user-select:none}
.cover-wrap.setup .globe{outline:3px dashed #e74c3c;background:rgba(231,76,60,.25)}
#setupInfo{position:fixed;left:10px;bottom:10px;background:#000;color:#0f0;padding:8px 12px;border-radius:8px;font:13px monospace;z-index:99}

/* sidebar: each icon expands on hover to show its name */
.sidebar{width:72px;flex:none;align-items:flex-start;position:relative;z-index:10}
.tab-btn{width:72px;display:flex;align-items:center;gap:14px;padding:12px 22px;overflow:hidden;white-space:nowrap;border-radius:0 12px 12px 0;
  transition:width .25s ease,opacity .2s,background .2s}
.tab-btn .ic{position:relative;font-size:26px;width:28px;text-align:center;flex:none;line-height:1}
.tab-btn .lbl{font-size:15px;font-weight:600;opacity:0;transition:opacity .2s .05s}
.tab-btn:hover{width:200px;opacity:1;background:#3d566e;box-shadow:4px 0 14px rgba(0,0,0,.25)}
.tab-btn:hover .lbl{opacity:1}
.tab-btn.active:hover{background:#3d566e}
.tab-btn .dot{top:-8px;right:-12px}
@media(max-width:700px){.sidebar{width:56px}.tab-btn{width:56px;padding:12px 14px}.tab-btn:hover{width:170px}}

.send .attach{width:auto;background:none;border:none;font-size:22px;cursor:pointer;padding:0 4px}
.send .attach:disabled{opacity:.35;cursor:default}
#attachPrev{display:flex;align-items:center;gap:8px;padding:8px 12px 0;border-top:1px solid #eee}
#attachPrev img{height:64px;border-radius:8px}
#attachPrev .attach{background:none;border:none;font-size:16px;cursor:pointer;color:#e74c3c}
.msg-img{display:block;max-width:240px;max-height:260px;border-radius:8px;margin-bottom:4px;cursor:zoom-in}
#lightbox{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;cursor:zoom-out}
#lightbox img{max-width:94%;max-height:94%;border-radius:8px}

/* dark mode */
[data-theme="dark"]{color-scheme:dark}
[data-theme="dark"] body{background:#121820;color:#e6edf3}
[data-theme="dark"] h1,[data-theme="dark"] .day-h,[data-theme="dark"] .chat-head{color:#e6edf3}
[data-theme="dark"] .card,[data-theme="dark"] .note,[data-theme="dark"] .chat-box,[data-theme="dark"] .inc-box{background:#1e2833;color:#e6edf3;box-shadow:0 4px 15px rgba(0,0,0,.35)}
[data-theme="dark"] input,[data-theme="dark"] textarea{background:#16202a;color:#e6edf3;border-color:#34414f}
[data-theme="dark"] input::placeholder,[data-theme="dark"] textarea::placeholder{color:#7d8d9c}
[data-theme="dark"] .sub,[data-theme="dark"] .note-time,[data-theme="dark"] .empty,[data-theme="dark"] .friends h3,[data-theme="dark"] .friend small,[data-theme="dark"] .msg span{color:#8b9bab}
[data-theme="dark"] .chat-head,[data-theme="dark"] .send,[data-theme="dark"] #attachPrev{border-color:#2d3a47}
[data-theme="dark"] .msg.in{background:#2b3744}
[data-theme="dark"] .msg.out{background:#2f5d3b}
[data-theme="dark"] .friend:hover,[data-theme="dark"] .friend.sel{background:#263645}
[data-theme="dark"] .callbtn{background:#263645}
[data-theme="dark"] .sidebar{background:#0d131a}
[data-theme="dark"] .tab-btn.active{background:#1e2c3a}
[data-theme="dark"] .tab-btn:hover,[data-theme="dark"] .tab-btn.active:hover{background:#26384a}
[data-theme="dark"] #cover{background:#0d131a}
[data-theme="dark"] .cover-wrap{background:#1e2833}
[data-theme="dark"] .back,[data-theme="dark"] button.sec{color:#6cb6ff}
</style>
</head>
<body>
<div id="banner" hidden></div>
<div id="callUI" hidden>
  <video id="remoteVid" autoplay playsinline></video>
  <video id="localVid" autoplay playsinline muted></video>
  <div id="callInfo"><div id="callName"></div><div id="callStatus"></div></div>
  <div class="call-bar">
    <button id="muteBtn" title="Mute / unmute microphone">🎤</button>
    <button id="camBtn" title="Camera on / off">📷</button>
    <button id="hangBtn" class="hang" title="Hang up">📵</button>
  </div>
</div>
<div id="lightbox" hidden><img alt=""></div>
<div id="incoming" hidden>
  <div class="inc-box"><div id="incName"></div>
    <div class="inc-btns"><button style="background:#4caf50" id="accBtn">Answer</button><button style="background:#e74c3c" id="decBtn">Decline</button></div>
  </div>
</div>

<!-- ============ COVER: click the speech bubble to enter ============ -->
<div id="cover">
  <div class="cover-wrap" id="coverWrap">
    <!-- Put your picture next to this file and name it Study-Study.jpg -->
    <img src="Study-Study.jpg" alt="Study study" draggable="false" onerror="this.removeAttribute('src');this.style.background='#b2bec3'">
    <div class="globe" id="bubble"></div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app" hidden>
  <div class="sidebar">
    <button class="tab-btn active" data-tab="diary"><span class="ic">📓</span><span class="lbl">Diary</span></button>
    <button class="tab-btn" data-tab="chat"><span class="ic">💬</span><span class="lbl">Messages</span></button>
    <button class="tab-btn" id="notifBtn"><span class="ic">🔔</span><span class="lbl">Notifications</span></button>
    <button class="tab-btn" id="themeBtn"><span class="ic">🌙</span><span class="lbl">Dark mode</span></button>
    <div class="spacer"></div>
    <button class="tab-btn" id="lockBtn"><span class="ic">🔒</span><span class="lbl">Hide</span></button>
    <button class="tab-btn" id="logoutBtn"><span class="ic">🚪</span><span class="lbl">Log out</span></button>
  </div>

  <div class="main">
    <!-- LOGIN -->
    <div id="login" class="card">
      <h1>🔐 Welcome</h1>
      <p class="sub">Just a username and password. No email.</p>
      <input id="u" placeholder="Username (3-20 letters, numbers, _)" autocomplete="username">
      <input id="p" type="password" placeholder="Password (min 6 characters)" autocomplete="current-password">
      <div class="err" id="authErr"></div>
      <button class="pri" id="authBtn">Log in</button>
      <button class="sec" id="authSwitch">New here? Create an account</button>
    </div>

    <!-- DIARY -->
    <div id="diaryPage" class="page active">
      <h1>📓 My Private Diary</h1>
      <p class="sub">Only you can read this. Saved to your account.</p>
      <div class="today" id="todayBar"></div>
      <div class="card">
        <textarea id="noteInput" placeholder="What's on your mind today?"></textarea>
        <input id="photoUrl" placeholder="Image link (optional, https://...)">
        <button class="pri" id="saveNote">Save entry</button>
      </div>
      <div id="notes"></div>
    </div>

    <!-- CHAT -->
    <div id="chatPage" class="page">
      <h1>💬 Messenger</h1>
      <p class="sub">Signed in as <b id="meName"></b></p>
      <div class="chat-grid" id="chatGrid">
        <div class="card friends friends-col">
          <input id="friendName" placeholder="Add friend by username" style="margin-bottom:6px">
          <button class="pri" id="addFriend">Send request</button>
          <div class="err" id="friendErr" style="margin-top:6px"></div>
          <div id="friendList"></div>
        </div>
        <div class="chat-box">
          <div class="chat-head"><span class="back" id="backBtn">← Back</span><span id="chatTitle">Pick a friend</span><button class="callbtn" id="callVoice" title="Voice call" hidden>📞</button><button class="callbtn" id="callVideo" title="Video call" hidden>📹</button></div>
          <div class="msgs" id="msgs"><div class="empty">Select a friend to start chatting.</div></div>
          <div id="attachPrev" hidden><img id="attachThumb" alt=""><button class="attach" id="attachClear" title="Remove">✕</button></div>
          <div class="send">
            <button class="attach" id="attachBtn" title="Send a photo or GIF" disabled>📎</button>
            <input type="file" id="fileInput" accept="image/*" hidden>
            <input id="msgInput" placeholder="Type a message..." disabled>
            <button class="pri" id="sendBtn" disabled>Send</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  var g=function(i){return document.getElementById(i)};
  function banner(m){var b=g('banner');b.textContent=m;b.hidden=false;}
  var NEED=3, count=0, tm; /* how many quick clicks on the globe open the app */
  var setup=location.hash==='#setup';
  g('bubble').onclick=function(){
    if(setup)return;
    count++;clearTimeout(tm);tm=setTimeout(function(){count=0},1500);
    if(count>=NEED){count=0;g('cover').hidden=true;g('app').hidden=false;}
  };
  if(setup){
    var w=g('coverWrap'),gl=g('bubble'),info=document.createElement('div');info.id='setupInfo';document.body.appendChild(info);
    w.classList.add('setup');
    var W=14,H=12,T=41,L=51;
    function show(){gl.style.top=T+'%';gl.style.left=L+'%';gl.style.width=W+'%';gl.style.height=H+'%';
      info.textContent='top:'+T.toFixed(1)+'%; left:'+L.toFixed(1)+'%; width:'+W.toFixed(1)+'%; height:'+H.toFixed(1)+'%   (click image to move, + / - to resize)';}
    w.addEventListener('click',function(e){var r=w.getBoundingClientRect();
      L=(e.clientX-r.left)/r.width*100-W/2;T=(e.clientY-r.top)/r.height*100-H/2;show();});
    document.addEventListener('keydown',function(e){
      if(e.key==='+'||e.key==='='){W+=1;H+=1;show();}
      if(e.key==='-'){W=Math.max(2,W-1);H=Math.max(2,H-1);show();}
    });
    show();
  }
  g('lockBtn').onclick=function(){g('app').hidden=true;g('cover').hidden=false;};
  /* light / dark theme (remembered on this device) */
  var root=document.documentElement;
  function applyTheme(t){
    root.setAttribute('data-theme',t);
    var b=g('themeBtn');b.querySelector('.ic').textContent=t==='dark'?'☀️':'🌙';b.querySelector('.lbl').textContent=t==='dark'?'Light mode':'Dark mode';
    var m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content',t==='dark'?'#0d131a':'#2c3e50');
  }
  var saved=null;try{saved=localStorage.getItem('theme');}catch(e){}
  applyTheme(saved||(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));
  g('themeBtn').onclick=function(){
    var t=root.getAttribute('data-theme')==='dark'?'light':'dark';applyTheme(t);
    try{localStorage.setItem('theme',t);}catch(e){}
  };
  document.querySelectorAll('[data-tab]').forEach(function(b){b.onclick=function(){
    document.querySelectorAll('[data-tab]').forEach(function(x){x.classList.remove('active')});
    document.querySelectorAll('.page').forEach(function(x){x.classList.remove('active')});
    b.classList.add('active');g(b.dataset.tab+'Page').classList.add('active');
  };});
  window.addEventListener('error',function(e){banner('Error: '+e.message)});
  window.addEventListener('load',function(){
    if(location.protocol==='file:')banner('Open this through your GitHub Pages link (https://...), not by double-clicking the file. Login and chat cannot work from a local file.');
  });
})();
</script>
